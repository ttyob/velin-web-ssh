<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VelinWebSSH</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 24px;
        background: radial-gradient(ellipse at 88% 0%, #283342 0, #171d26 32%, #101216 72%);
        color: #ececf0;
      }
      .credential-dialog {
        width: min(408px, 100%);
        padding: 28px;
        border: 1px solid #ffffff14;
        border-radius: 22px;
        background: #1a1e25d9;
        box-shadow: 0 24px 64px -32px #0008;
      }
      .credential-dialog[hidden] { display: none; }
      .brand { display: flex; align-items: center; gap: 9px; margin: 0 0 28px; font-size: 25px; font-weight: 600; letter-spacing: -.8px; }
      .brand svg { padding: 7px; width: 36px; height: 36px; border: 1px solid #ffffff1a; border-radius: 11px; background: #ffffff0d; }
      h1 { margin: 0; font-size: 24px; font-weight: 600; }
      .description { margin: 10px 0 24px; color: #9299a6; font-size: 13px; line-height: 1.7; }
      .field { margin-top: 16px; }
      label { display: block; margin-bottom: 8px; color: #b9bfca; font-size: 12px; }
      input {
        width: 100%; height: 46px; padding: 0 13px;
        border: 1px solid #ffffff1c; border-radius: 11px;
        outline: none; background: #15181e; color: #ececf0;
        font: 14px Consolas, "Courier New", monospace;
      }
      input:focus { border-color: #b3c0d6; }
      .notice { min-height: 20px; margin: 16px 0 4px; color: #9299a6; font-size: 12px; line-height: 1.6; }
      .notice.success { color: #b3c0d6; }
      .notice.error { color: #e2a2a8; }
      .actions { display: flex; gap: 10px; margin-top: 20px; }
      button {
        flex: 1; min-width: 0; min-height: 44px; padding: 0 12px;
        border: 1px solid #ffffff24; border-radius: 11px;
        background: transparent; color: #ececf0;
        font: 600 13px "Segoe UI", "Microsoft YaHei", sans-serif;
        cursor: pointer;
      }
      button:hover { background: #ffffff0d; }
      button:focus-visible { outline: 2px solid #b3c0d6; outline-offset: 3px; }
      button.primary { border-color: #ececf0; background: #ececf0; color: #141519; }
      button.primary:hover { background: #fff; }
    </style>
  </head>
  <body>
    <section id="credential-dialog" class="credential-dialog" role="dialog" aria-modal="true" hidden>
      <p class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg>velin</p>
      <h1 id="credential-title">初始管理员凭据</h1>
      <p id="credential-description" class="description"></p>
      <div class="field">
        <label for="credential-username">用户名</label>
        <input id="credential-username" readonly />
      </div>
      <div class="field">
        <label for="credential-password">密码</label>
        <input id="credential-password" readonly />
      </div>
      <p id="copy-notice" class="notice" aria-live="polite">点击“复制密码”后可直接粘贴到登录页。</p>
      <div class="actions">
        <button id="copy-password" type="button">复制密码</button>
        <button id="continue-login" class="primary" type="button">进入登录</button>
      </div>
    </section>
    <script>
      const serviceURL = __VELIN_DESKTOP_URL_JSON__;
      const credentials = __VELIN_DESKTOP_CREDENTIALS_JSON__;

      if (!credentials) {
        window.location.replace(serviceURL);
      } else {
        const dialog = document.getElementById("credential-dialog");
        const passwordInput = document.getElementById("credential-password");
        const notice = document.getElementById("copy-notice");
        document.getElementById("credential-title").textContent = credentials.reset ? "管理员密码已重置" : "初始管理员凭据";
        document.getElementById("credential-description").textContent = credentials.reset
          ? "管理员密码已重置，旧登录会话已失效。"
          : "首次启动已创建管理员账号，请保存密码并在登录后修改。";
        document.getElementById("credential-username").value = credentials.username;
        passwordInput.value = credentials.password;
        dialog.hidden = false;

        async function copyPassword() {
          try {
            if (navigator.clipboard?.writeText) {
              await navigator.clipboard.writeText(credentials.password);
            } else {
              passwordInput.focus();
              passwordInput.select();
              if (!document.execCommand("copy")) throw new Error("copy failed");
            }
            notice.textContent = "密码已复制，可在登录页按 Ctrl+V 粘贴。";
            notice.className = "notice success";
          } catch {
            passwordInput.focus();
            passwordInput.select();
            notice.textContent = "自动复制失败，已选中密码，请按 Ctrl+C。";
            notice.className = "notice error";
          }
        }

        document.getElementById("copy-password").addEventListener("click", copyPassword);
        document.getElementById("continue-login").addEventListener("click", () => window.location.replace(serviceURL));
      }
    </script>
  </body>
</html>
