name: velin_mobile
description: "Velin 手机 SSH 与 AI CLI 开发客户端"
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  dio: 5.9.0
  crypto: 3.0.8
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.3
  webview_flutter: 4.13.0
  flutter_svg: 2.2.1
  file_picker: 10.3.3
  uuid: 4.5.1
  web: 1.1.1
  cupertino_icons: 1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/terminal/
