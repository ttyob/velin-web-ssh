name: Build and publish Docker, fnOS and Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test backend
        run: go test ./...
      - name: Vet backend
        run: go vet ./...
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ttyob/velin-web-ssh
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=VelinWebSSH
            org.opencontainers.image.description=Self-hosted browser SSH workspace
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VELIN_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows desktop application
        env:
          VELIN_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails.exe build -platform windows/amd64 -clean -m -s -skipbindings -ldflags "-X github.com/ttyob/velin-web-ssh/internal/version.Current=$env:VELIN_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/bin/velin-web-ssh.exe "release/velin-web-ssh-windows-gui-amd64-${env:VELIN_VERSION}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: velin-web-ssh-windows-desktop-release
          path: release/velin-web-ssh-windows-gui-amd64-*.exe
          if-no-files-found: error

  fnos-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build fnOS application package
        env:
          VELIN_FNOS_VERSION: ${{ github.ref_name }}
          VELIN_FNOS_ARCH: ${{ matrix.arch }}
        run: packaging/fnos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: velin-web-ssh-fnos-package-${{ matrix.arch }}
          path: dist/fnos/velin-web-ssh-fnos-native-*.fpk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish, fnos-package, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: velin-web-ssh-windows-desktop-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: velin-web-ssh-fnos-package-*
          path: release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum velin-web-ssh-fnos-native-*.fpk velin-web-ssh-windows-gui-amd64-*.exe > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Docker 镜像：`ghcr.io/ttyob/velin-web-ssh:${{ github.ref_name }}`，支持 `linux/amd64` 和 `linux/arm64`。

            飞牛 fnOS 原生应用：下载对应架构的 `.fpk` 安装包，使用 `checksums.txt` 校验文件完整性。

            Windows x64 桌面版：下载 `.exe` 即可运行，网页资源已内嵌。需要 WebView2 Runtime。
          files: |
            release/velin-web-ssh-fnos-native-*.fpk
            release/velin-web-ssh-windows-gui-amd64-*.exe
            release/checksums.txt
