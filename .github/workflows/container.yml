name: Build and publish Docker, fnOS and Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test backend
        shell: bash
        run: |
          set +e
          go test -count=1 -timeout=15m -json ./... | tee backend-tests.json
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            while IFS=$'\t' read -r package test_name; do
              echo "::error title=Go test failed::package=${package} test=${test_name}"
            done < <(jq -r 'select(.Action == "fail" and .Test != null) | [.Package, .Test] | @tsv' backend-tests.json)
            {
              echo "## Backend test failure"
              echo '```text'
              jq -rj 'select(.Action == "output") | .Output' backend-tests.json | tail -n 120
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$test_status"
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report-${{ github.run_id }}
          path: backend-tests.json
          if-no-files-found: error
          retention-days: 7
      - name: Vet backend
        run: go vet ./...
      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Test desktop launcher page
        working-directory: web
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:launcher
      - name: Test Telegram settings
        working-directory: web
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:telegram

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ttyob/velin-web-ssh
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Jeex Terminal
            org.opencontainers.image.description=Self-hosted browser SSH workspace
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VELIN_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows-desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: Build Windows desktop application
        env:
          VELIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          wails.exe build -platform windows/amd64 -clean -m -s -skipbindings -skipembedcreate -ldflags "-X github.com/ttyob/velin-web-ssh/internal/version.Current=$env:VELIN_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/bin/velin-web-ssh.exe "release/velin-web-ssh-windows-gui-amd64-${env:VELIN_VERSION}.exe"
      - name: Test Windows launcher integration
        run: go test -tags desktop,production .
      - name: Smoke test managed Windows service
        shell: pwsh
        run: packaging/windows/smoke-desktop-worker.ps1 -Executable (Get-Item release/velin-web-ssh-windows-gui-amd64-*.exe).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: velin-web-ssh-windows-desktop-release
          path: release/velin-web-ssh-windows-gui-amd64-*.exe
          if-no-files-found: error

  fnos-package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "18.20.4"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build fnOS application package
        env:
          VELIN_FNOS_VERSION: ${{ github.ref_name }}
          VELIN_FNOS_ARCH: ${{ matrix.arch }}
        run: packaging/fnos/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: velin-web-ssh-fnos-package-${{ matrix.arch }}
          path: dist/fnos/velin-web-ssh-fnos-native-*.fpk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, publish, fnos-package, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: velin-web-ssh-windows-desktop-release
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: velin-web-ssh-fnos-package-*
          path: release
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum velin-web-ssh-fnos-native-*.fpk velin-web-ssh-windows-gui-amd64-*.exe > checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Docker 镜像：`ghcr.io/ttyob/velin-web-ssh:${{ github.ref_name }}`，支持 `linux/amd64` 和 `linux/arm64`。

            飞牛 fnOS 原生应用：下载对应架构的 `.fpk` 安装包，使用 `checksums.txt` 校验文件完整性。

            Windows x64：下载 `windows-gui` EXE，启动时选择窗口模式或服务模式。管理员可在设置中一键更新；程序会校验 EXE 并在启动失败时回滚。请将 EXE 放在当前用户可写的目录。服务模式保留小型管理窗口，支持服务启停、开机自启和密码管理；浏览器默认访问 `http://127.0.0.1:8377`。网页资源已内嵌，需要 WebView2 Runtime。
          files: |
            release/velin-web-ssh-fnos-native-*.fpk
            release/velin-web-ssh-windows-gui-amd64-*.exe
            release/checksums.txt
